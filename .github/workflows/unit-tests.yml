name: unit-tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore Jest dependencies
        run: npm ci --prefix src/Tests.Scripts
      - name: Plugin unit tests (FakeXrmEasy)
        run: dotnet test src/Tests.Plugins/Tests.Plugins.csproj --configuration Release
      - name: Build script bundle
        run: dotnet build src/Scripts.UI/Scripts.UI.csproj --configuration Release
      - name: Script unit tests (Jest)
        run: npm test --prefix src/Tests.Scripts -- --ci
      - name: Lab helper and SDK-result tests
        run: |
          pwsh -NoProfile -File .lab-scripts/tests/Lab.Common.Tests.ps1
          pwsh -NoProfile -File .lab-scripts/tests/PackSolution.Tests.ps1
          pwsh -NoProfile -File .lab-scripts/tests/ConnectionReference.Tests.ps1
          node --experimental-strip-types --test .lab-scripts/tests/operation-result.test.mjs
