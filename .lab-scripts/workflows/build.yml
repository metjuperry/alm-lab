name: build
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      # The code app project builds with Vite, which needs Node 20.19+ / 22.12+
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore WarehouseManagement.slnx
      - name: Build (validates Dataverse solutions)
        if: ${{ hashFiles('src/**/*.csproj') != '' }}
        run: dotnet build WarehouseManagement.slnx --configuration Release --no-restore
      - name: Publish package
        if: ${{ hashFiles('src/Packages.Main/Packages.Main.csproj') != '' }}
        run: |
          dotnet publish src/Packages.Main/Packages.Main.csproj --configuration Release --no-build -o ./drop
          # The .pdpkg.zip is created alongside the project, not in --output; collect it for deploy
          cp src/Packages.Main/bin/Release/Packages.Main.pdpkg.zip ./drop/
      - name: Record portable connection binding
        if: ${{ hashFiles('src/Solutions.Connectors/Other/Customizations.xml') != '' }}
        shell: pwsh
        run: |
          [xml]$xml = Get-Content src/Solutions.Connectors/Other/Customizations.xml -Raw
          $reference = $xml.SelectSingleNode('//connectionreference')
          if ($reference) {
            @{ logicalName = $reference.connectionreferencelogicalname } |
              ConvertTo-Json | Set-Content ./drop/connection-reference.json
          }
      - name: Verify final application payload
        if: ${{ hashFiles('src/Tests.Plugins/Tests.Plugins.csproj') != '' }}
        shell: pwsh
        run: .lab-scripts/Test-LabArtifact.ps1 -Package ./drop/Packages.Main.pdpkg.zip -Complete
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('src/Packages.Main/Packages.Main.csproj') != '' }}
        with:
          name: drop
          path: |
            ./drop/Packages.Main.pdpkg.zip
            ./drop/connection-reference.json
          if-no-files-found: error
